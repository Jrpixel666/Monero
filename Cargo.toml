[workspace]
resolver = "2"
members = [
  "crates/wallet-core",
  "crates/storage",
  "crates/network",
  "crates/rpc",
  "crates/ffi",
  "crates/uniffi-bindgen",
]
# fuzz/ is its own standalone crate (cargo-fuzz convention): it needs nightly-only sanitizer
# flags this workspace's other members don't, so it's excluded rather than made a member.
exclude = ["fuzz"]

[profile.release]
# Never strip/optimize away panics in a wallet handling secrets; a controlled abort beats
# continuing past a violated invariant.
panic = "abort"
overflow-checks = true

[profile.dev]
overflow-checks = true
