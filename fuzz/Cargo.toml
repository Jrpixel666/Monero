[package]
name = "wallet-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wallet-core = { path = "../crates/wallet-core" }
storage = { path = "../crates/storage" }

[[bin]]
name = "fuzz_uri_parse"
path = "fuzz_targets/fuzz_uri_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_storage_decrypt"
path = "fuzz_targets/fuzz_storage_decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_address_parse"
path = "fuzz_targets/fuzz_address_parse.rs"
test = false
doc = false
bench = false
