# cargo-deny configuration. Run: cargo install cargo-deny && cargo deny check
#
# Loosely modeled on monero-oxide's own deny.toml, for consistency with the dependency we build
# on, with `[sources]` extended to allow monero-oxide's git dependency (our own crates pin it to
# a specific commit, not a branch — see crates/wallet-core/Cargo.toml's comment).

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

# None of these have a safe upgrade available upstream yet, and none are our own code, so they're
# tracked here (and in SECURITY.md) rather than silently failing CI on something we can't fix by
# editing this repo. Re-check each when touching dependencies and remove the ignore once resolved.
ignore = [
  # crypto-bigint timing-variability issue (fix in >=0.7.6): transitive via monero-oxide's own
  # monero-ed25519 crate, pinned at our checked-in `rev`. Bump the pinned rev once monero-oxide
  # itself moves past this, not before — forcing an incompatible crypto-bigint version here could
  # silently break actual key-material arithmetic.
  "RUSTSEC-2026-0387",
  # Unmaintained, not vulnerable; all three are transitive through uniffi_bindgen's own
  # build-time codegen (askama/bincode), not this project's runtime code.
  "RUSTSEC-2026-0374", # basic-toml
  "RUSTSEC-2025-0141", # bincode
  "RUSTSEC-2024-0436", # paste
]

[licenses]
version = 2
allow = [
  "Unlicense",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/monero-oxide/monero-oxide"]
