[package]
name = "storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Argon2id + XChaCha20-Poly1305 encrypted-at-rest wallet storage envelope"
license = "MIT"
publish = false

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["std"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
rand_core = { version = "0.6", features = ["std", "getrandom"] }
thiserror = "2"
